name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Create a completely fresh branch with NO history to get rid of the zip remnants
          git checkout --orphan temp-main
          git add -A
          git commit -m "Clean deployment without binary history"
          
          # Force push this clean branch directly over Hugging Face's main branch
          git push --force https://anay606:$HF_TOKEN@huggingface.co/spaces/anay123456/fu temp-main:main
