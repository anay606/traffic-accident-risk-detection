name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pull full history to satisfy Hugging Face's restriction
      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          # Force push to cleanly overwrite the space branch directly with your main branch status
          git push --force https://anay606:$HF_TOKEN@huggingface.co/spaces/anay123456/fu main:main
